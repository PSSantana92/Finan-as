<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' https://apis.google.com https://www.google.com https://www.gstatic.com; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src https://fonts.gstatic.com; img-src 'self' data: blob:; connect-src 'self' https://api.anthropic.com https://firestore.googleapis.com https://identitytoolkit.googleapis.com https://securetoken.googleapis.com https://www.googleapis.com https://firebaseinstallations.googleapis.com https://content-firebaseappcheck.googleapis.com https://fonts.googleapis.com https://fonts.gstatic.com; frame-src https://*.firebaseapp.com https://accounts.google.com https://apis.google.com https://www.google.com; worker-src 'self' blob:; object-src 'none'; base-uri 'self'; form-action 'none'">
<meta name="referrer" content="no-referrer">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icons/icon-192.png">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Finanças">
<title>Minhas Finanças</title>
<meta name="theme-color" content="#0b1433">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
/* VOICE work: a money tool used daily on the phone
   IDEA a bank app's month statement: one balance, the flow in and out, the bills coming due
   PICTURE the month's flow bar (income vs spending, spending split by category) drawn large on Início
   COLOUR navy ground, light ink, teal for money in, coral for money out, yellow accent for due bills
   TYPE Manrope 800 for figures, Manrope 500 for text
   LAYOUT phone: header, scrolling view, bottom tab bar and + button; laptop: left rail, content up to 1100px */
:root{color-scheme:dark;--bg:#0b1433;--s1:#121c46;--s2:#1a2759;--line:#2b3a78;--ink:#eef1ff;--mute:#a3aedb;--in:#4fc1c6;--out:#ff7356;--acc:#f7e463;--blue:#6b7cff;--r:14px}
*{box-sizing:border-box;min-width:0}
[hidden]{display:none!important}
html,body{height:100%}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.5 Manrope,system-ui,sans-serif;overflow:hidden}
button,input,select{font:inherit;color:inherit}
h1,h2,h3,.disp{font-family:Manrope,system-ui,sans-serif;letter-spacing:-.02em;line-height:1.1;margin:0}
h2{font-size:20px;font-weight:700;margin:0 0 12px}
.app{display:grid;grid-template-rows:auto 1fr auto;height:100%}
header{display:flex;align-items:center;gap:8px;padding:calc(14px + env(safe-area-inset-top,0px)) max(4vw,16px,env(safe-area-inset-right,0px)) 10px max(4vw,16px,env(safe-area-inset-left,0px));background:var(--bg)}
header .hd{flex:1;display:grid;gap:1px}
header .hd span{font-size:13px;color:var(--mute)}
header h1{font-size:20px;font-weight:800}
.mon{display:flex;gap:8px}
.sq{width:40px;height:40px;border-radius:12px;border:1px solid var(--line);background:var(--s1);cursor:pointer;display:grid;place-items:center}
.sq:hover{background:var(--s2)}
.sq svg{width:18px;height:18px;stroke:currentColor;fill:none;stroke-width:2.2;stroke-linecap:round;stroke-linejoin:round}
.ib{width:38px;height:38px;border-radius:999px;border:0;background:transparent;cursor:pointer;display:grid;place-items:center}
.ib:hover{background:var(--s2)}
.ib svg{width:20px;height:20px;stroke:currentColor;fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
main{overflow-y:auto;overflow-x:hidden;padding:12px max(4vw,16px,env(safe-area-inset-right,0px)) 40px max(4vw,16px,env(safe-area-inset-left,0px))}
.wrap{max-width:1100px;margin:0 auto}
nav{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));align-items:center;border-top:1px solid var(--line);background:var(--s1);padding:6px 6px calc(10px + env(safe-area-inset-bottom,0px))}
nav button{border:0;background:none;cursor:pointer;display:grid;justify-items:center;gap:3px;padding:6px 0;font-size:11px;font-weight:600;color:var(--mute);border-radius:10px}
nav button svg{width:22px;height:22px;stroke:currentColor;fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
nav button.on{color:var(--acc)}
.fab{justify-self:center;width:56px;height:56px;margin-top:-28px;border-radius:18px;border:0;background:var(--acc);color:#0b1433;cursor:pointer;box-shadow:0 6px 18px rgba(0,0,0,.4);display:grid;place-items:center;padding:0}
nav .fab svg,.fab svg{width:26px;height:26px;stroke:#0b1433;stroke-width:2.6;fill:none;stroke-linecap:round}
.fab span{display:none}
@media(min-width:900px){
 .app{grid-template-columns:200px 1fr;grid-template-rows:auto 1fr}
 header{grid-column:1/3}
 nav{grid-row:2;grid-column:1;grid-template-columns:1fr;align-content:start;border-top:0;border-right:1px solid var(--line);gap:4px;padding:14px 10px}
 nav button{grid-auto-flow:column;justify-content:start;gap:12px;font-size:15px;padding:10px 12px}
 nav button.on{background:var(--s2)}
 .fab{order:-1;justify-self:stretch;width:auto;height:46px;margin:0 0 10px;border-radius:12px;grid-auto-flow:column;gap:8px;font-weight:800;color:#0b1433}
 .fab span{display:inline}
 .fab svg{width:20px;height:20px}
}
.card{background:var(--s1);border:1px solid var(--line);border-radius:var(--r);padding:16px}
.grid2{display:grid;gap:16px}
@media(min-width:720px){.grid2{grid-template-columns:minmax(0,1fr) minmax(0,1fr)}}
.mute{color:var(--mute)}
.sm{font-size:14px}
.in{color:var(--in)}.out{color:var(--out)}
.num{font-variant-numeric:tabular-nums;white-space:nowrap}
.hero{display:grid;gap:18px;margin-bottom:16px}
.big{font-family:Manrope;font-weight:800;font-size:clamp(38px,9vw,60px);letter-spacing:-.03em;line-height:1}
.figs{display:grid;grid-template-columns:repeat(auto-fit,minmax(9em,1fr));gap:12px}
.lfigs{grid-template-columns:repeat(3,minmax(0,1fr))}.lfigs .fig{padding:12px}
.fig b{display:block;font-family:Manrope;font-size:clamp(16px,4.4vw,24px);font-weight:700}
.flow{display:grid;gap:8px}
.flow .lab{display:flex;justify-content:space-between;font-size:14px;color:var(--mute)}
.bar{height:26px;border-radius:8px;background:var(--s2);overflow:hidden;display:flex}
.bar i{display:block;height:100%}
.legend{display:flex;flex-wrap:wrap;gap:6px 14px;font-size:14px;color:var(--mute)}
.legend span{display:inline-flex;align-items:center;gap:6px}
.dot{width:10px;height:10px;border-radius:3px;display:inline-block;flex:none}
.row{display:flex;align-items:center;gap:12px;padding:11px 0;border-bottom:1px solid var(--line);cursor:pointer}
.row:last-child{border-bottom:0}
.row .t{flex:1}
.row .t b{display:block;font-weight:500;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.row .t small{display:block;color:var(--mute);font-size:13px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.day{font-size:13px;color:var(--mute);margin:16px 0 2px;font-weight:700}
.pill{font-size:12px;font-weight:700;padding:3px 9px;border-radius:999px;white-space:nowrap;background:var(--s2);color:var(--mute)}
.pill.paga{background:color-mix(in srgb,var(--in) 22%,transparent);color:var(--in)}
.pill.vencida{background:color-mix(in srgb,var(--out) 25%,transparent);color:var(--out)}
.pill.fechada{background:color-mix(in srgb,var(--acc) 22%,transparent);color:var(--acc)}
.btn{border:1px solid var(--line);background:var(--s2);border-radius:12px;padding:10px 16px;cursor:pointer;font-weight:700;min-height:44px}
.btn:hover{border-color:var(--mute)}
.btn.pri{background:var(--acc);color:#0b1433;border-color:var(--acc)}
.btn.dan{color:var(--out)}
.btn:disabled{opacity:.5;cursor:default}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{border:1px solid var(--line);background:transparent;border-radius:999px;padding:7px 13px;cursor:pointer;font-size:14px;display:inline-flex;align-items:center;gap:6px}
.chip.on{background:var(--ink);color:var(--bg);border-color:var(--ink)}
label.f{display:grid;gap:6px;font-size:14px;color:var(--mute)}
input[type=text],input[type=date],input[type=number],input[type=search],input[type=password],select{width:100%;background:var(--bg);border:1px solid var(--line);border-radius:10px;padding:10px 12px;font-size:16px;color:var(--ink);min-height:44px}
input:focus,select:focus,button:focus-visible{outline:2px solid var(--blue);outline-offset:1px}
.seg{display:grid;grid-template-columns:1fr 1fr;background:var(--bg);border:1px solid var(--line);border-radius:12px;padding:3px}
.seg button{border:0;background:none;border-radius:9px;padding:9px;cursor:pointer;font-weight:700;color:var(--mute)}
.seg button.on.o{background:var(--out);color:#1a0d08}
.seg button.on.i{background:var(--in);color:#06201f}
.amt{font-family:Manrope;font-size:40px!important;font-weight:800;text-align:center;border:0!important;background:transparent!important;padding:6px!important}
.sheet{position:fixed;inset:0;background:rgba(3,6,20,.6);display:grid;align-items:end;justify-items:center;z-index:20}
.sheet>div{background:var(--s1);border:1px solid var(--line);border-radius:20px 20px 0 0;width:min(560px,100%);max-height:92%;overflow-y:auto;padding:18px max(16px,env(safe-area-inset-right,0px)) calc(18px + env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px));display:grid;gap:14px}
@media(min-width:700px){.sheet{align-items:center}.sheet>div{border-radius:20px}}
.hint{font-size:13px;color:var(--acc)}
.cc{border-radius:16px;padding:16px;color:#fff;display:grid;gap:14px;min-height:150px;align-content:space-between;position:relative;overflow:hidden}
.cc::after{content:"";position:absolute;right:-40px;top:-40px;width:160px;height:160px;border-radius:50%;background:rgba(255,255,255,.12)}
.cc .nm{font-family:Manrope;font-weight:800;font-size:22px}
.cc .meta{display:flex;justify-content:space-between;gap:10px;font-size:14px;opacity:.95;flex-wrap:wrap}
.inv{border-bottom:1px solid var(--line)}
.inv:last-child{border-bottom:0}
.inv summary{display:flex;align-items:center;gap:10px;padding:12px 0;cursor:pointer;list-style:none}
.inv summary::-webkit-details-marker{display:none}
.inv summary .t{flex:1}
.hbar{display:grid;grid-template-columns:minmax(7em,9em) minmax(0,1fr) auto;gap:10px;align-items:center;padding:6px 0;font-size:14px}
.hbar .tr{height:14px;background:var(--s2);border-radius:5px;overflow:hidden}
.hbar .tr i{display:block;height:100%;border-radius:5px}
.hbar .nm{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.evo{position:relative;height:260px}
.evo svg{position:absolute;inset:0;width:100%;height:100%}
svg text{font:13px Manrope,sans-serif;fill:var(--mute)}
.drop{border:2px dashed var(--line);border-radius:var(--r);padding:28px 16px;text-align:center;display:grid;gap:10px;justify-items:center;cursor:pointer}
.drop.over{border-color:var(--acc)}
.rv{display:grid;grid-template-columns:auto minmax(0,1fr);gap:10px;padding:12px 0;border-bottom:1px solid var(--line);align-items:start}
.rv .fs{display:grid;grid-template-columns:repeat(auto-fit,minmax(8.5em,1fr));gap:8px}
.rv.off{opacity:.5}
.rv input[type=checkbox]{width:22px;height:22px;margin-top:10px;accent-color:var(--acc)}
.warn{font-size:13px;color:var(--acc)}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(100px + env(safe-area-inset-bottom,0px));background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:12px;z-index:30;display:flex;gap:14px;align-items:center;font-weight:500;max-width:calc(100% - 32px)}
.toast button{border:0;background:none;font-weight:800;color:#3b4fd8;cursor:pointer}
.empty{text-align:center;padding:36px 16px;display:grid;gap:14px;justify-items:center}
.stack{display:grid;gap:16px}
.ins{display:grid;grid-template-columns:repeat(auto-fit,minmax(9.5em,1fr));gap:12px}
.ins div{background:var(--s2);border-radius:12px;padding:12px 14px}
.ins b{display:block;font-family:Manrope;font-size:20px}
.spin{width:22px;height:22px;border:3px solid var(--line);border-top-color:var(--acc);border-radius:50%;animation:sp 1s linear infinite}
@keyframes sp{to{transform:rotate(360deg)}}
@media(prefers-reduced-motion:reduce){.spin{animation:none}}
.tbl{width:100%;border-collapse:collapse;font-size:14px}
.tbl td{padding:8px 4px;border-bottom:1px solid var(--line)}
/* Option A components */
.card{border-radius:20px}
h2{font-size:17px;font-weight:800}
.tile{width:38px;height:38px;border-radius:12px;display:grid;place-items:center;flex:none;color:#0b1433}
.tile.s{width:24px;height:24px;border-radius:8px}
.tile.xs{width:20px;height:20px;border-radius:6px}
.chip .tile.xs{margin-left:-5px}
.bal{border-radius:22px;padding:18px;background:linear-gradient(135deg,#3b4fd8,#2a8fb0);display:grid;gap:14px;margin-bottom:16px}
.bal .bl{display:flex;align-items:center;gap:8px;font-size:13px;color:#e4e9ff}
.bal .bv{font-size:clamp(32px,9.5vw,46px);font-weight:800;letter-spacing:-.02em;line-height:1.05}
.bal .bv.neg{color:#ffd2c8}
.io{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
.io>div{background:rgba(11,20,51,.28);border-radius:14px;padding:10px;display:flex;gap:10px;align-items:center}
.io .ar{width:32px;height:32px;border-radius:10px;display:grid;place-items:center;flex:none}
.io small{display:block;font-size:12px;color:#dfe5ff}
.io b{display:block;font-size:clamp(13px,3.9vw,16px)}
.qa{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:8px;margin-bottom:16px}
.qa button{border:0;background:none;cursor:pointer;display:grid;justify-items:center;gap:6px;font-size:12px;font-weight:600;padding:0}
.qa i{width:52px;height:52px;border-radius:16px;background:var(--s2);display:grid;place-items:center}
.qa button:hover i{background:var(--line)}
.hh{display:flex;justify-content:space-between;align-items:baseline;gap:10px;margin-bottom:12px}
.hh h2{margin:0}
.lk{border:0;background:none;color:#9fb0ff;font-weight:700;font-size:13px;cursor:pointer;padding:4px 0}
.dn{display:flex;gap:16px;align-items:center}
.ring{width:116px;height:116px;border-radius:50%;display:grid;place-items:center;flex:none}
.ring>div{width:78px;height:78px;border-radius:50%;background:var(--s1);display:grid;place-content:center;text-align:center;line-height:1.2}
.ring span{font-size:11px;color:var(--mute)}
.ring b{font-size:14px}
.lg{flex:1;display:grid;gap:7px;font-size:13px}
.lg>div{display:flex;align-items:center;gap:8px}
.lg .n{flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.pp{display:grid;gap:8px;margin-top:14px;padding-top:14px;border-top:1px solid var(--line)}
.pp .bar{height:12px;border-radius:6px}
.pp .lgp{display:grid;grid-template-columns:repeat(auto-fit,minmax(6.5em,1fr));gap:6px;font-size:12px}
.pp .lgp b{display:block;font-size:14px}
.mcs{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:10px}
.mc{border:0;text-align:left;cursor:pointer;border-radius:16px;padding:12px;color:#fff;display:grid;gap:8px;min-height:100px;align-content:space-between;position:relative;overflow:hidden}
.mc::after{content:"";position:absolute;right:-30px;top:-30px;width:100px;height:100px;border-radius:50%;background:rgba(255,255,255,.12)}
.mc .t1{display:flex;justify-content:space-between;gap:6px;font-size:12px;font-weight:700}
.mc .t1 span:first-child{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.mc .t1 span+span{flex:none;white-space:nowrap;opacity:.9}
.mc b{font-size:18px}
.mc small{font-size:12px;opacity:.95}
.mc .pill{position:relative;z-index:1;justify-self:start;background:rgba(0,0,0,.28);color:#fff}
.row .tile{width:38px;height:38px}
.hbar .nm{display:flex;align-items:center;gap:8px}
.hbar .nm em{font-style:normal;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
</style>

</head>
<body>
<div class="app">
 <header>
  <div class="hd"><span id="hHi"></span><h1 id="hT">Finanças</h1></div>
  <div class="mon" id="mon"><button class="sq" id="mPrev" aria-label="Mês anterior"><svg viewBox="0 0 24 24"><path d="M15 18l-6-6 6-6"/></svg></button><button class="sq" id="mNext" aria-label="Próximo mês"><svg viewBox="0 0 24 24"><path d="M9 18l6-6-6-6"/></svg></button></div>
  <button class="sq" id="gear" aria-label="Ajustes"><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.7 1.7 0 0 0 .3 1.8l.1.1a2 2 0 1 1-2.8 2.8l-.1-.1a1.7 1.7 0 0 0-1.8-.3 1.7 1.7 0 0 0-1 1.5V21a2 2 0 1 1-4 0v-.1a1.7 1.7 0 0 0-1.1-1.5 1.7 1.7 0 0 0-1.8.3l-.1.1a2 2 0 1 1-2.8-2.8l.1-.1a1.7 1.7 0 0 0 .3-1.8 1.7 1.7 0 0 0-1.5-1H3a2 2 0 1 1 0-4h.1a1.7 1.7 0 0 0 1.5-1.1 1.7 1.7 0 0 0-.3-1.8l-.1-.1a2 2 0 1 1 2.8-2.8l.1.1a1.7 1.7 0 0 0 1.8.3H9a1.7 1.7 0 0 0 1-1.5V3a2 2 0 1 1 4 0v.1a1.7 1.7 0 0 0 1 1.5 1.7 1.7 0 0 0 1.8-.3l.1-.1a2 2 0 1 1 2.8 2.8l-.1.1a1.7 1.7 0 0 0-.3 1.8V9a1.7 1.7 0 0 0 1.5 1H21a2 2 0 1 1 0 4h-.1a1.7 1.7 0 0 0-1.5 1z"/></svg></button>
 </header>
 <main id="main"><div class="wrap"><div class="empty"><div class="spin"></div><p class="mute">Abrindo seus dados…</p></div></div></main>
 <nav id="nav">
  <button data-v="home"><svg viewBox="0 0 24 24"><path d="M3 11l9-8 9 8v10a1 1 0 0 1-1 1h-5v-7H9v7H4a1 1 0 0 1-1-1z"/></svg>Início</button>
  <button data-v="list"><svg viewBox="0 0 24 24"><path d="M8 6h13M8 12h13M8 18h13M3 6h.01M3 12h.01M3 18h.01"/></svg>Lançam.</button>
  <button class="fab" id="fab" aria-label="Novo lançamento"><svg viewBox="0 0 24 24"><path d="M12 5v14M5 12h14"/></svg><span>Novo lançamento</span></button>
  <button data-v="bills"><svg viewBox="0 0 24 24"><rect x="2" y="5" width="20" height="14" rx="2"/><path d="M2 10h20"/></svg>Faturas</button>
  <button data-v="rep"><svg viewBox="0 0 24 24"><path d="M3 3v18h18"/><path d="M7 15l4-4 3 3 6-7"/></svg>Relatórios</button>
 </nav>
</div>
<div id="sheet"></div>
<div id="toast" hidden></div>
<input type="file" id="bkFile" accept=".json,application/json" hidden>

<script src="firebase-config.js"></script>
<script src="app.js"></script>

</body>
</html>
